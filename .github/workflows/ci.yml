name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite
        env:
          USER_PROFILES_TABLE: TestUserProfiles
        run: npm test

  infrastructure-tests:
    name: Infrastructure Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CDK Jest tests
        run: npm run test --workspace infrastructure

  python-backend-tests:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/agentic-api/requirements.txt
          pip install pytest hypothesis moto

      - name: Run Python tests
        working-directory: lambda/agentic-api
        run: python -m pytest tests/ -v
