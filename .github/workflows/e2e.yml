name: E2E Tests

on:
  pull_request:

concurrency:
  group: e2e-tests
  cancel-in-progress: false  # Queue, don't cancel — avoids orphaned stacks

permissions:
  contents: read
  id-token: write  # Required for GitHub OIDC → AWS

jobs:
  ci:
    name: Unit Tests (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript tests
        env:
          USER_PROFILES_TABLE: TestUserProfiles
        run: npm test

  e2e:
    name: E2E Tests
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.E2E_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: CDK Bootstrap
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap aws://$ACCOUNT_ID/us-east-1

      - name: Deploy stack
        run: |
          npx cdk deploy --all --require-approval never \
            --outputs-file cdk-outputs.json
        timeout-minutes: 30

      - name: Extract outputs
        id: outputs
        run: |
          URL=$(jq -r '.AiLeagueCommunityEditionStack.UserInterfaceDomainName' cdk-outputs.json)
          PASSWORD=$(jq -r '.AiLeagueCommunityEditionStack.AdminPassword' cdk-outputs.json)
          # Ensure URL has https:// prefix but not doubled
          URL="${URL#https://}"
          URL="${URL#http://}"
          echo "base_url=https://$URL" >> $GITHUB_OUTPUT
          echo "admin_password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Wait for CloudFront propagation
        run: sleep 30

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ steps.outputs.outputs.base_url }}
          ADMIN_EMAIL: admin@aileague.community
          ADMIN_PASSWORD: ${{ steps.outputs.outputs.admin_password }}
          AWS_REGION: us-east-1
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

      - name: Cleanup VPC dependencies
        if: always()
        run: |
          # SageMaker creates EFS file systems, mount targets, security groups, and ENIs
          # inside the CDK VPC that aren't managed by CloudFormation.
          # These must be deleted before cdk destroy can remove the VPC/subnets.
          VPC_ID=$(aws cloudformation describe-stack-resources \
            --stack-name AiLeagueCommunityEditionStack \
            --logical-resource-id SageMakerVpcB0F5038C \
            --query 'StackResources[0].PhysicalResourceId' --output text 2>/dev/null || echo "")

          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Cleaning up VPC: $VPC_ID"

            # 1. Delete EFS mount targets in subnets (these create ENIs that block subnet deletion)
            SUBNET_IDS=$(aws ec2 describe-subnets \
              --filters Name=vpc-id,Values=$VPC_ID \
              --query 'Subnets[].SubnetId' --output text)
            for subnet in $SUBNET_IDS; do
              MT_IDS=$(aws efs describe-mount-targets \
                --query "MountTargets[?SubnetId=='${subnet}'].MountTargetId" --output text 2>/dev/null || echo "")
              for mt in $MT_IDS; do
                echo "Deleting EFS mount target: $mt"
                aws efs delete-mount-target --mount-target-id $mt || true
              done
            done

            # 2. Wait for mount targets to be deleted (they take a few seconds)
            if [ -n "$SUBNET_IDS" ]; then
              echo "Waiting for mount targets to be removed..."
              sleep 30
            fi

            # 3. Delete EFS file systems that were in this VPC
            FS_IDS=$(aws efs describe-file-systems \
              --query 'FileSystems[].FileSystemId' --output text 2>/dev/null || echo "")
            for fs in $FS_IDS; do
              MT_COUNT=$(aws efs describe-mount-targets --file-system-id $fs \
                --query 'length(MountTargets)' --output text 2>/dev/null || echo "0")
              if [ "$MT_COUNT" = "0" ]; then
                echo "Deleting EFS file system: $fs"
                aws efs delete-file-system --file-system-id $fs || true
              fi
            done

            # 4. Delete all ENIs in the VPC
            ENI_IDS=$(aws ec2 describe-network-interfaces \
              --filters Name=vpc-id,Values=$VPC_ID \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)
            for eni in $ENI_IDS; do
              echo "Deleting network interface: $eni"
              ATTACH_ID=$(aws ec2 describe-network-interfaces --network-interface-ids $eni \
                --query 'NetworkInterfaces[0].Attachment.AttachmentId' --output text 2>/dev/null || echo "None")
              if [ "$ATTACH_ID" != "None" ] && [ -n "$ATTACH_ID" ]; then
                aws ec2 detach-network-interface --attachment-id $ATTACH_ID --force 2>/dev/null || true
                sleep 5
              fi
              aws ec2 delete-network-interface --network-interface-id $eni || true
            done

            # 5. Delete non-default security groups
            SG_IDS=$(aws ec2 describe-security-groups \
              --filters Name=vpc-id,Values=$VPC_ID \
              --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text)
            for sg in $SG_IDS; do
              echo "Deleting security group: $sg"
              aws ec2 delete-security-group --group-id $sg || true
            done
          fi

      - name: Destroy stack
        if: always()
        run: |
          # First attempt
          npx cdk destroy --all --force || true

          # Retry loop: handles AgentCoreRuntime timeouts and SageMaker ENI issues
          # Each iteration waits 120s for async resource deletion, cleans VPC, retries
          for destroy_attempt in 1 2; do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name AiLeagueCommunityEditionStack \
              --query 'Stacks[0].StackStatus' --output text 2>&1 || echo "gone")

            if [[ "$STATUS" != "DELETE_FAILED" ]]; then
              echo "Stack status: $STATUS — no retry needed"
              break
            fi

            echo "=== Retry $destroy_attempt: stack in DELETE_FAILED ==="
            echo "Waiting 120s for resources (AgentCoreRuntime, ENIs) to finish deleting..."
            sleep 120

            # Clean VPC dependencies (ENIs and security groups)
            VPC_ID=$(aws cloudformation describe-stack-resources \
              --stack-name AiLeagueCommunityEditionStack \
              --logical-resource-id SageMakerVpcB0F5038C \
              --query 'StackResources[0].PhysicalResourceId' --output text 2>/dev/null || echo "")
            if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
              echo "Cleaning VPC: $VPC_ID"
              ENI_IDS=$(aws ec2 describe-network-interfaces \
                --filters Name=vpc-id,Values=$VPC_ID \
                --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null || echo "")
              for eni in $ENI_IDS; do
                ATTACH_ID=$(aws ec2 describe-network-interfaces --network-interface-ids $eni \
                  --query 'NetworkInterfaces[0].Attachment.AttachmentId' --output text 2>/dev/null || echo "None")
                if [ "$ATTACH_ID" != "None" ] && [ -n "$ATTACH_ID" ]; then
                  echo "Force-detaching ENI: $eni"
                  aws ec2 detach-network-interface --attachment-id $ATTACH_ID --force 2>/dev/null || true
                fi
              done
              sleep 10
              for eni in $ENI_IDS; do
                echo "Deleting ENI: $eni"
                aws ec2 delete-network-interface --network-interface-id $eni 2>/dev/null || true
              done
              SG_IDS=$(aws ec2 describe-security-groups \
                --filters Name=vpc-id,Values=$VPC_ID \
                --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || echo "")
              for sg in $SG_IDS; do
                echo "Deleting security group: $sg"
                aws ec2 delete-security-group --group-id $sg 2>/dev/null || true
              done
            fi

            echo "Retrying stack deletion (attempt $((destroy_attempt + 1)))..."
            aws cloudformation delete-stack --stack-name AiLeagueCommunityEditionStack
            aws cloudformation wait stack-delete-complete \
              --stack-name AiLeagueCommunityEditionStack || true
          done
        timeout-minutes: 30

      - name: Verify destroy succeeded
        if: always()
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name AiLeagueCommunityEditionStack \
            --query 'Stacks[0].StackStatus' --output text 2>&1 || echo "DELETE_COMPLETE")
          if [[ "$STATUS" != *"does not exist"* && "$STATUS" != "DELETE_COMPLETE" ]]; then
            echo "ERROR: Stack still exists with status: $STATUS"
            exit 1
          fi
