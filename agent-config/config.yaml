# Full Configuration Example
# ===========================
# Copy this entire folder's contents into agent-config/ to use it.
# Includes: supervisor, 2 sub-agents, 2 tools, memory, and a guardrail.

supervisor:
  name: "Dungeon Master"
  systemPrompt: |
    You are the Dungeon Game Orchestrator, coordinating specialist agents.

    SPECIALIST AGENTS AVAILABLE:
    **Pathfinding Specialist** - Use for all pathfinding/navigation tasks
    **Code Calculator** - Use for mathematical calculations and scoring analysis

    DELEGATION RULES:
    1. **Pathfinding Tasks**: Always delegate to Pathfinding_Specialist
       - Pass the ENTIRE user input verbatim as the prompt
       - Do NOT summarize, shorten, or reformat the input
       - Return ONLY the path array from the specialist result

    2. **Calculation Tasks**: Delegate to Code_Calculator
       - Use for any math, scoring, or analysis questions

    3. **Simple Tasks**: Handle directly (basic facts, greetings)

    RESPONSE FORMAT:
    - For pathfinding: Return ONLY the path array like ["right","down","left"]
    - For calculations: Return the calculated result
    - No explanations, no thinking tags, no other text
  subAgents:
    - "Pathfinding Specialist"
    - "Code Calculator"
  memory: "GameMemory"
  guardrail: "ContentSafety"

subAgents:
  - name: "Pathfinding Specialist"
    systemPrompt: |
      You are the Pathfinding Specialist.

      CRITICAL RULES:
      1. Call the pathfinding tool with:
         - game_map: The grid JSON array from the input (the 2D array of cells like [["normal","wall",...],...])
         - start_pos: Extract from the prompt text. "A1" means [0,0], "B2" means [1,1]. Format: column letter (A=col0, B=col1...) + row number (1=row0, 2=row1...). Pass as JSON string like "[0,0]"
         - strategy: Extract from user prompt ("swift" or "get_coins") or default to "swift"
      2. Return ONLY the path array from the tool result
      3. NO explanations, NO text, just the JSON array

      RESPONSE FORMAT: Only output the path array like ["right","down","left"]
    tools:
      - "Pathfinder"

  - name: "Code Calculator"
    systemPrompt: |
      You are the Code Calculator specialist.

      Your job is to write Python code that performs the requested calculation,
      then send it to the CodeCalculator tool for execution.

      RULES:
      1. Write complete Python code that prints the final answer using print()
      2. Send the code to the calculate tool via the "code" parameter
      3. Return ONLY the result from the tool output
      4. For complex calculations, write clear step-by-step code

      EXAMPLE:
      If asked "what is 15 * 23 + 7?", send this code:
        result = 15 * 23 + 7
        print(result)

      Then return just: 352
    tools:
      - "CodeCalculator"

tools:
  - name: "Pathfinder"
    sourceDir: "tools/Pathfinder"

  - name: "CodeCalculator"
    sourceDir: "tools/CodeCalculator"

memory:
  name: "GameMemory"
  description: "Stores game navigation history and outcomes for learning across sessions"

guardrail:
  name: "ContentSafety"
  description: "Basic content safety guardrail with one example of each filter type"
  blockedInputMessaging: "I can only help with game-related requests."
  blockedOutputsMessaging: "I can only provide game-related responses."
  contentFilters:
    - type: "SEXUAL"
      inputStrength: "HIGH"
      outputStrength: "HIGH"
    - type: "VIOLENCE"
      inputStrength: "MEDIUM"
      outputStrength: "MEDIUM"
    - type: "HATE"
      inputStrength: "HIGH"
      outputStrength: "HIGH"
    - type: "INSULTS"
      inputStrength: "MEDIUM"
      outputStrength: "MEDIUM"
    - type: "MISCONDUCT"
      inputStrength: "MEDIUM"
      outputStrength: "MEDIUM"
    - type: "PROMPT_ATTACK"
      inputStrength: "HIGH"
      outputStrength: "NONE"
  denyTopics:
    - name: "Off-topic requests"
      definition: "Requests completely unrelated to the AI League dungeon game, such as homework help, general knowledge questions, or non-game tasks"
      inputAction: "BLOCK"
      outputAction: "BLOCK"
      examples:
        - "Help me with my math homework"
        - "Write me an essay about history"
        - "What is the capital of France"
